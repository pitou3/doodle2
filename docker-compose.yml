services:
  app:
    build: ./docker
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_CONFIG: /var/www/html/docker/config.php
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_HOST: db
      DB_NAME: doodle2
      DB_USER: doodle2
      DB_PASSWORD: doodle2
      TEST_DB_NAME: doodle2_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: doodle2
      MARIADB_USER: doodle2
      MARIADB_PASSWORD: doodle2
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Capture tous les emails envoyés : interface sur http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
